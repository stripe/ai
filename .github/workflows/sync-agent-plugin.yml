name: Sync agent plugin branch

on:
  push:
    branches:
      - main
    paths:
      - 'providers/agent-plugins/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-agent-plugin:
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate GitHub App token
        id: app-token
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.GH_APP_STRIPE_AI_SYNC_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_STRIPE_AI_SYNC_PEM }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Split and push agent-plugins subtree
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          git config user.name "stripe-ai-sync[bot]"
          git config user.email "282683001+stripe-ai-sync[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/${{ github.repository }}

          git subtree split --prefix=providers/agent-plugins -b dist/agent-plugins
          git push origin dist/agent-plugins --force
