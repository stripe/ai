name: Sync skills from docs.stripe.com

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed canary commit
        required: true
        type: string

permissions: {}

jobs:
  repository-metadata:
    if: github.repository == 'stripe/ai' && github.ref == 'refs/heads/assessment/ai-sync-repositories-20261118-5136c291a91a' && github.sha == inputs.expected_sha
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Read exact installation repository metadata
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GH_APP_STRIPE_AI_SYNC_CLIENT_ID: ${{ secrets.GH_APP_STRIPE_AI_SYNC_CLIENT_ID }}
          GH_APP_STRIPE_AI_SYNC_PEM: ${{ secrets.GH_APP_STRIPE_AI_SYNC_PEM }}
        run: node .github/assessment/ai-sync-repositories.mjs
