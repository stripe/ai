name: Sync skills from docs.stripe.com

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at 00:00 UTC
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
        
      - name: Generate GitHub App token
        id: app-token
        if: |
          github.ref == 'refs/heads/main'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.GH_APP_STRIPE_AI_SYNC_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_STRIPE_AI_SYNC_PEM }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'

      - name: Run sync script
        run: node scripts/sync.js
    
      - name: Push to Github
        if: |
          github.ref == 'refs/heads/main'&&
          !github.event.repository.fork
        shell: bash
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_BRANCH: main
          COMMIT_MESSAGE: sync skills
          FILES: |
            :(glob)**/skills/**
            .claude-plugin/marketplace.json
            .cursor-plugin/marketplace.json
            .grok-plugin/marketplace.json
            providers/claude/plugin/.claude-plugin/plugin.json
            providers/codex/plugin/.codex-plugin/plugin.json
            providers/cursor/plugin/.cursor-plugin/plugin.json
            providers/grok/plugin/.grok-plugin/plugin.json
            providers/agent-plugins/plugin/plugin.json
        run: |
          node scripts/push-branch.js --branch "$TARGET_BRANCH" --message "$COMMIT_MESSAGE" --files "$FILES"
